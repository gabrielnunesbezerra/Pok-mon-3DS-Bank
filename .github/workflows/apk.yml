# PK confront: testa o motor, compila o APK Android e publica na página de Releases
# (release "apk", sempre com a versão mais nova).
name: apk

on:
  push:
    branches: ['claude/pokemon-2d-battle-arena-timgkk']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - name: Instalar dependências
        run: npm ci
      - name: Testes do motor (todos os golpes)
        run: npm test
      - name: Copiar o jogo para o projeto Android
        run: npx cap sync android
      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Separar o APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PKconfront.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PKconfront-apk
          path: PKconfront.apk
      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=apk
          gh release delete "$tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          notes="APK do PK confront gerado a partir do commit ${GITHUB_SHA::7}.

          Como instalar: baixe o PKconfront.apk no celular Android, abra o arquivo e permita instalar apps de fontes desconhecidas quando o Android pedir. As próximas versões instalam por cima, sem perder nada.

          Projeto de fã, sem fins lucrativos."
          gh release create "$tag" PKconfront.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "PK confront (APK)" --notes "$notes"
