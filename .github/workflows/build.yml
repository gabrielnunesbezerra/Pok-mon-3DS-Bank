name: build

on:
  push:
    branches: [main, 'dev/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore
        run: dotnet restore PKForge.sln
      - name: Test
        run: |
          dotnet test tests/PKForge.Domain.Tests/PKForge.Domain.Tests.csproj --no-restore --configuration Release
          dotnet test tests/PKForge.Engine.Tests/PKForge.Engine.Tests.csproj --no-restore --configuration Release
      # A push to main publishes a release when the app version (ApplicationDisplayVersion in
      # PKForge.App.csproj) has no release yet: bump the version, push, and the APK appears.
      - name: Decide release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's:.*<ApplicationDisplayVersion>\(.*\)</ApplicationDisplayVersion>.*:\1:p' src/PKForge.App/PKForge.App.csproj | head -1)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] || [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if ! gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then publish=true; fi
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then publish=true; echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version v$version, publish: $publish"
      # Every 3DS Bank APK must carry the same signature, or Android refuses to update an
      # installed copy (and uninstalling first would delete the Bank). The keystore itself is
      # the repository secret BANK_ANDROID_KEYSTORE_BASE64; without it nobody can sign, so its
      # password and alias can live here.
      - name: Decode signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.BANK_ANDROID_KEYSTORE_BASE64 }}
          PUBLISH: ${{ steps.release.outputs.publish }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            if [[ "$PUBLISH" == "true" ]]; then
              echo "::error::The BANK_ANDROID_KEYSTORE_BASE64 secret is missing; releases must be signed with the 3DS Bank key."
              exit 1
            fi
            echo "::warning::No signing secret: this test APK uses a throwaway key and cannot update an installed 3DS Bank."
            exit 0
          fi
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > "${RUNNER_TEMP}/3dsbank.p12"; then
            echo "::error::BANK_ANDROID_KEYSTORE_BASE64 is not valid base64; paste the whole file again."
            exit 1
          fi
          if ! keytool -list -v -keystore "${RUNNER_TEMP}/3dsbank.p12" -storetype PKCS12 -storepass 73bc24f4bc659c3ecfa8928740cf84e0 > "${RUNNER_TEMP}/key.txt" 2>&1; then
            echo "::error::The signing key in BANK_ANDROID_KEYSTORE_BASE64 cannot be opened: $(tail -1 "${RUNNER_TEMP}/key.txt")"
            exit 1
          fi
          echo "::notice::Signing with $(grep -m1 'SHA256:' "${RUNNER_TEMP}/key.txt" | xargs)"
          echo "keystore=${RUNNER_TEMP}/3dsbank.p12" >> "$GITHUB_OUTPUT"
      - name: Build Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
          ANDROID_KEYSTORE_PASSWORD: 73bc24f4bc659c3ecfa8928740cf84e0
          ANDROID_KEY_ALIAS: threedsbank
        run: |
          # Release, never Debug: a Debug APK expects an IDE to deploy its assemblies and
          # closes at once when installed by hand.
          # Sideloaded APK only; no Play Store bundle.
          signing_args=(-p:AndroidPackageFormats=apk -p:AndroidKeyStore=false)
          if [[ -n "$ANDROID_KEYSTORE_PATH" ]]; then
            # The 3DS Bank key is EC (P-256): jarsigner must be told, it assumes RSA.
            signing_args=(
              -p:AndroidPackageFormats=apk
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$ANDROID_KEYSTORE_PATH"
              -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD"
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
              -p:AndroidSigningKeyPass="$ANDROID_KEYSTORE_PASSWORD"
              -p:AndroidApkSigningAlgorithm=SHA256withECDSA
            )
          fi
          set -o pipefail
          if ! dotnet build src/PKForge.App/PKForge.App.csproj --no-restore \
            --configuration Release -f net10.0-android "${signing_args[@]}" 2>&1 | tee build.log; then
            # Annotations are readable without the raw log: surface the first errors there.
            grep -E ': error |error [A-Z]+[0-9]+|Exception|apksigner' build.log | sort -u | head -15 | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
            exit 1
          fi
      - name: Locate APK
        id: apk
        run: |
          apk=$(find src/PKForge.App/bin -name '*-Signed.apk' | head -1)
          if [[ -z "$apk" ]]; then echo "::error::No signed APK was produced."; exit 1; fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          name="3DSBank-${{ steps.release.outputs.tag }}.apk"
          cp "$apk" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: 3dsbank-apk
          path: ${{ steps.apk.outputs.name }}
          retention-days: 14
      - name: Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 3DS Bank ${{ steps.release.outputs.tag }}
          files: ${{ steps.apk.outputs.name }}
          body: |
            Baixe o arquivo **${{ steps.apk.outputs.name }}** abaixo no celular e abra para instalar.
            Na primeira vez o Android pede para permitir a instalação de apps desconhecidos.

            Download **${{ steps.apk.outputs.name }}** below on your phone and open it to install.
          generate_release_notes: true
