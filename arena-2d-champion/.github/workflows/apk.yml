# Usado quando esta pasta vira a raiz do próprio repositório (ARENA-2D-CAHMPION):
# testa o motor, compila o APK e publica na página de Releases (release "apk").
name: apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Instalar dependências
        run: npm ci
      - name: Testes do motor (todos os golpes)
        run: npm test
      - name: Copiar o jogo para o projeto Android
        run: npx cap sync android
      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Separar o APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ArenaChampion.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ArenaChampion-apk
          path: ArenaChampion.apk
      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=apk
          gh release delete "$tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          notes="APK do Arena 2D Champion gerado a partir do commit ${GITHUB_SHA::7}.

          Como instalar: baixe o ArenaChampion.apk no celular Android, abra o arquivo e permita instalar apps de fontes desconhecidas quando o Android pedir. As próximas versões instalam por cima, sem perder nada.

          Projeto de fã, sem fins lucrativos."
          gh release create "$tag" ArenaChampion.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Arena 2D Champion (APK)" --notes "$notes"
